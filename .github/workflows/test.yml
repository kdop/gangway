name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.folder }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [acceptance, cli, controller, shared]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.folder }}/go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: go test -count=1 -cover ./... | tee test.out
      - name: Coverage
        if: always()
        shell: bash
        run: |
          {
            echo "### Lines run by the tests: ${{ matrix.folder }}"
            echo
            echo "| Package | Lines run |"
            echo "|---|---|"
            grep -E "coverage: [0-9.]+%" test.out | awk '{
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^github.com\/kdop\/gangway\//) { name = $i; sub("github.com/kdop/gangway/", "", name) }
                if ($i == "coverage:") print "| `" name "` | " $(i + 1) " |"
              }
            }'
          } >> "$GITHUB_STEP_SUMMARY"
