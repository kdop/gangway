name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # A pull request runs only the tests of the folders it changes. A push to
  # main and a release run them all.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.pick.outputs.folders }}
      any: ${{ steps.pick.outputs.any }}
      docs: ${{ steps.pick.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull request the commit is the merge into main, and its
          # first parent is main.
          fetch-depth: 2
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | .github/scripts/what-to-test.sh | tee -a "$GITHUB_OUTPUT"
          else
            .github/scripts/what-to-test.sh all | tee -a "$GITHUB_OUTPUT"
          fi

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: The docs and the Go tests match
        shell: bash
        run: |
          (cd cli && go test -count=1 -run 'TestDesignAndGoTestsMatch|TestUNITSETTINGS01' ./...)
          (cd controller && go test -count=1 -run 'TestDesignAndGoTestsMatch' ./...)
          (cd acceptance && go test -count=1 -run 'TestEveryTestThatIsDueHasAGoTest' .)

  go:
    name: ${{ matrix.folder }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.folders) }}
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.folder }}/go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Check the install script
        if: matrix.folder == 'acceptance'
        run: shellcheck ../install.sh ../.github/scripts/what-to-test.sh ../.github/scripts/coverage-picture.sh
      - name: Test
        shell: bash
        run: go test -count=1 -cover ./... | tee test.out
      - name: Coverage
        if: always() && matrix.folder != 'acceptance'
        shell: bash
        run: |
          {
            echo "### Lines run by the tests: ${{ matrix.folder }}"
            echo
            echo "| Package | Lines run |"
            echo "|---|---|"
            { grep -E "coverage: [0-9.]+%" test.out || true; } | awk '{
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^github.com\/kdop\/gangway\//) { name = $i; sub("github.com/kdop/gangway/", "", name) }
                if ($i == "coverage:") print "| `" name "` | " $(i + 1) " |"
              }
            }'
          } >> "$GITHUB_STEP_SUMMARY"
