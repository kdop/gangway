name: Controller image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kdop/gangway-controller

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f controller/Dockerfile -t "$IMAGE:build" .
      - name: The image starts
        run: docker run --rm "$IMAGE:build" -h 2>&1 | grep -q "How to start gangway-controller"
      # A merge to main gives the short commit id and "latest". A version
      # tag gives its own name.
      - name: Store
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            versions=("$GITHUB_REF_NAME")
          else
            versions=("${GITHUB_SHA::7}" latest)
          fi
          for version in "${versions[@]}"; do
            docker tag "$IMAGE:build" "$IMAGE:$version"
            docker push "$IMAGE:$version"
            echo "Stored $IMAGE:$version" >> "$GITHUB_STEP_SUMMARY"
          done
