name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Build
        shell: bash
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            (cd cli && GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "../dist/gangway-linux-$arch" ./cmd/gangway)
            (cd controller && GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "../dist/gangway-controller-linux-$arch" .)
          done
      # The test build of the cli-tool reads the admin folder from a variable.
      # A file that holds the variable's name is that build and must not ship.
      - name: Refuse the test build
        shell: bash
        run: |
          for file in dist/*; do
            if grep -a -q GANGWAY_TEST_ADMIN_FOLDER "$file"; then
              echo "$file is the test build"
              exit 1
            fi
          done
      - name: Try the program
        run: ./dist/gangway-linux-amd64 --help
      - name: Checksums
        working-directory: dist
        run: sha256sum gangway-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gangway
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gangway
          path: dist
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
